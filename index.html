<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARK Map Rotation</title>
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦖%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<script>
/* Apply the saved theme before the page paints (no flash). Default = dark. */
try{var m=document.cookie.match(/(?:^|; )theme=(dark|light)/);if(m)document.documentElement.dataset.theme=m[1]}catch(e){}
</script>
<style>
:root{
  --bg:#0b0f14; --text:#f3f6fa; --border:rgba(255,255,255,.1);
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --btn-bg:rgba(12,17,24,.55); --btn-fg:#f3f6fa;
  --ov-a:rgba(4,7,11,.92); --ov-b:rgba(4,7,11,.35);
  --accent:#f2b134; color-scheme:dark;
}
[data-theme=light]{
  --bg:#e9eef4; --text:#0f1722; --border:rgba(15,23,34,.14);
  --shadow:0 12px 32px rgba(40,60,90,.2);
  --btn-bg:rgba(255,255,255,.72); --btn-fg:#0f1722;
  --ov-a:rgba(8,16,28,.78); --ov-b:rgba(8,16,28,.12);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;overflow:hidden;transition:background .25s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout: one screen, no scrolling. Big card on top, two small cards below. */
main{height:100vh;height:100dvh;max-width:1100px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  display:grid;grid-template-rows:minmax(0,1.45fr) minmax(0,1fr);gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.card{position:relative;overflow:hidden;min-height:0;border-radius:22px;border:1px solid var(--border);
  box-shadow:var(--shadow);background:linear-gradient(135deg,var(--c1),var(--c2));
  container-type:size;isolation:isolate}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--ov-a),var(--ov-b) 60%,transparent)}

.tag{position:absolute;top:clamp(12px,3.5cqw,20px);left:clamp(12px,3.5cqw,20px);padding:.2em .8em;border-radius:99px;
  font-weight:700;font-size:clamp(15px,3.2cqw,22px);line-height:1.2;color:#14100a;background:var(--accent)}
.tag.nxt{background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.info{position:absolute;inset:auto 0 0 0;padding:clamp(12px,3.5cqw,24px);display:flex;flex-direction:column;gap:clamp(6px,2cqh,14px);color:#fff}
h2{font-weight:800;line-height:.95;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.current h2{font-size:clamp(34px,min(14cqw,22cqh),100px)}
.small h2{font-size:clamp(16px,min(14cqw,10cqh),40px)}

.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:clamp(6px,2cqh,12px) clamp(4px,1.5cqw,10px);
  border-radius:14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.timer div{text-align:center}
.timer b{display:block;font-weight:700;font-size:clamp(20px,min(8.5cqw,16cqh),52px);line-height:1;font-variant-numeric:tabular-nums}
.timer i{display:block;margin-top:.25em;font-style:normal;font-weight:500;font-size:clamp(11px,2.2cqw,15px);opacity:.75}
/* Narrow cards (phones): 2x2 grid so the digits can stay big */
@container (max-width:280px){
  .timer{grid-template-columns:1fr 1fr;row-gap:6px}
  .timer b{font-size:clamp(20px,min(16cqw,9cqh),36px)}
}

/* Theme button */
#theme{position:fixed;top:calc(18px + env(safe-area-inset-top));right:18px;z-index:5;width:42px;height:42px;
  display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);
  background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s,background .25s}
#theme:hover{transform:rotate(18deg) scale(1.06)}
#theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#theme svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[data-theme=dark] .moon,[data-theme=light] .sun{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1 class="sr">ARK map rotation</h1>

<button id="theme" type="button" aria-label="Switch between dark and light mode" title="Switch theme">
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<main>
  <section class="card current" id="c0"></section>
  <div class="row">
    <section class="card small" id="c1"></section>
    <section class="card small" id="c2"></section>
  </div>
</main>

<script>
/* ============ EDIT THESE ============ */
// The moment the FIRST map in the list below goes live. "Z" = UTC.
// For local time use an offset instead, e.g. "2026-11-09T18:00:00+02:00"
const ROTATION_START = "2026-11-09T00:00:00Z";
// How many days each map stays active
const DAYS_PER_MAP = 7;
// Rotation order (loops forever). img = artwork, c1/c2 = fallback colours if the image can't load
const WIKI = "https://ark.wiki.gg/images/";
const MAPS = [
  { name: "Aberration",     img: WIKI + "Aberration_DLC.jpg",     c1: "#0f766e", c2: "#1e3a8a" },
  { name: "Scorched Earth", img: WIKI + "Scorched_Earth_DLC.jpg", c1: "#b45309", c2: "#7c2d12" },
  { name: "Extinction",     img: WIKI + "Extinction_DLC.jpg",     c1: "#6d28d9", c2: "#0e7490" }
];
/* ==================================== */

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const DUR = DAYS_PER_MAP * 864e5, T0 = Date.parse(ROTATION_START);
const LABELS = ["days", "hrs", "min", "sec"];
let shown = -1, refs = [];

function timerHTML() {
  return '<div class="timer">' + LABELS.map(l => `<div><b>00</b><i>${l}</i></div>`).join("") + "</div>";
}

function build(cur) {
  [0, 1, 2].forEach(slot => {
    const m = MAPS[(cur + slot) % MAPS.length], el = $("c" + slot);
    el.style.setProperty("--c1", m.c1);
    el.style.setProperty("--c2", m.c2);
    const tag = slot === 0 ? '<span class="tag">Current</span>' : slot === 1 ? '<span class="tag nxt">Next</span>' : "";
    el.innerHTML =
      `<img src="${m.img}" alt="${m.name} artwork" decoding="async" onerror="this.remove()">` +
      `<div class="shade"></div>${tag}` +
      `<div class="info"><h2>${m.name}</h2>${slot ? timerHTML() : ""}</div>`;
    refs[slot] = slot ? [...el.querySelectorAll("b")] : null;
  });
}

function show(slot, ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
  refs[slot].forEach((b, i) => { const t = pad(v[i]); if (b.textContent !== t) b.textContent = t; });
}

function tick() {
  const elapsed = Date.now() - T0;
  const cur = ((Math.floor(elapsed / DUR) % MAPS.length) + MAPS.length) % MAPS.length;
  const left = DUR - (((elapsed % DUR) + DUR) % DUR);   // ms until the next map goes live
  if (cur !== shown) { build(cur); shown = cur; }
  show(1, left);          // "Next" map
  show(2, left + DUR);    // the one after
}

/* Theme toggle + cookie (remembered for 1 year) */
const root = document.documentElement, meta = document.querySelector('meta[name=theme-color]');
function setTheme(t, save) {
  root.dataset.theme = t;
  meta.content = t === "dark" ? "#0b0f14" : "#e9eef4";
  if (save) { try { document.cookie = "theme=" + t + ";max-age=31536000;path=/;SameSite=Lax"; } catch (e) {} }
}
$("theme").addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark", true));
setTheme(root.dataset.theme, false);

tick();
setInterval(tick, 250);
document.addEventListener("visibilitychange", tick);
</script>
</body>
</html>
